name: 🐛 Bug Report
description: File a bug report
labels: [Bug Report]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: version
    attributes:
      label: Theme version
      description: What version of the theme are you using?
      placeholder: Please use the full tag, avoid "latest"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        Describe clearly and concisely the bug including configuration used, and screenshots ideally.
      placeholder: |
        Please add as many details as possible to avoid assumptions from our side. How do you trigger this bug? What did you expect to happen?
    validations:
      required: true
